[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwyt-airouter"
version = "0.1.1"
description = "dwyt AI router: models.yaml -> llama-swap/LiteLLM configs, GPU container starters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dwyt-airouter = "dwyt_airouter.cli:main"

[tool.setuptools]
packages = ["dwyt_airouter"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
